[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-rl"
version = "0.1.0"
description = "A modular, plug-and-play Reinforcement Learning framework with Human-in-the-Loop and Continual Learning capabilities."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "torchvision>=0.15.0",
    "onnx>=1.14.0",
    "onnxscript>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "httpx>=0.24.0",
    "uvicorn[standard]>=0.23.0",
    "swig>=4.0.0",
    "gymnasium[box2d]>=0.29.0",
]
api = [
    "uvicorn[standard]>=0.23.0",
]
examples = [
    "swig>=4.0.0",
    "gymnasium[box2d]>=0.29.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"core_rl" = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
